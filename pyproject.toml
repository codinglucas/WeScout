[project]
name = "wescout"
version = "0.2.0"
description = "Football scouting: provider adapters -> DuckDB -> ETL -> FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.3",
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
browser = [
    "selenium>=4.52.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wescout"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["legacy/"]
