<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WeScout - Login">
    <title>WeScout - Comece sua jornada</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">WeScout</a>
        </nav>
    </header>

    <!-- Login Section -->
    <main class="login-container">
        <div class="login-background">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
        </div>

        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">
                    Start your <span class="gradient-text">journey</span>
                </h1>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Password (repeat)</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        class="form-input"
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                </div>

                <div class="error-message" id="errorMessage"></div>

                <button type="submit" class="btn btn-submit">
                    Google Login
                </button>

                <div class="login-footer">
                    <p class="footer-text">
                        Already a WeScout member? 
                        <a href="#entrar" class="footer-link">Login</a>
                    </p>
                </div>
            </form>
        </div>
    </main>

    <!-- Particles Background -->
    <div class="particles-container" id="particles"></div>

    <script src="script.js"></script>
    <script src="login.js"></script>
</body>
</html>
